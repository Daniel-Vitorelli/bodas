<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fdf6e3" />
    <title>Antônio & Cida · 50 Anos de Amor</title>
    <meta name="description" content="Jubileu de Ouro — 50 anos de casados. Antônio & Cida convidam você para comemorar." />

    <!-- ===== Prévia do link (WhatsApp / Facebook / Instagram / LinkedIn) =====
         IMPORTANTE: o WhatsApp só lê o HTML cru (não executa JavaScript), por isso
         estas tags ficam aqui no index.html e não no React.

         O marcador __SITE_URL__ é trocado no build pelo endereço público do site
         (ver o plugin em vite.config.js). Na Vercel ele é detectado sozinho; para
         forçar outro domínio, defina VITE_SITE_URL no .env ou nas Environment
         Variables da Vercel. Não é preciso editar nada aqui à mão. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Antônio & Cida · Bodas de Ouro" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="Antônio & Cida · 50 Anos de Amor" />
    <meta property="og:description" content="Jubileu de Ouro — 50 anos de casados. Abra o convite e celebre com Antônio & Cida." />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:image" content="__SITE_URL__/og-image.jpg" />
    <meta property="og:image:secure_url" content="__SITE_URL__/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Antônio & Cida — Bodas de Ouro, 50 anos de casados" />

    <!-- Twitter/X (usa summary_large_image para a imagem aparecer grande) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Antônio & Cida · 50 Anos de Amor" />
    <meta name="twitter:description" content="Jubileu de Ouro — 50 anos de casados. Abra o convite e celebre com Antônio & Cida." />
    <meta name="twitter:image" content="__SITE_URL__/og-image.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Poppins:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
